<style>
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(500px,1fr));gap:18px}
.wrap{width:480px;height:272px;margin:8px 0 4px}
.scr{width:480px;height:272px;position:relative;overflow:hidden;border-radius:4px;background:#0d1117;color:#e6edf3;font-family:"Segoe UI",Arial,sans-serif}
.scr *{box-sizing:border-box}
.tabs{position:absolute;left:0;top:0;width:480px;height:28px;background:#161b22;display:flex;gap:4px;padding:4px 92px 0 4px}
.tab{flex:1;height:24px;border-radius:6px 6px 0 0;background:#21262d;color:#8b949e;font-size:13px;display:flex;align-items:center;padding:0 6px;gap:5px;white-space:nowrap;overflow:hidden}
.tab.sel{background:#0d1117;color:#fff;font-weight:700;box-shadow:inset 0 3px 0 #a371f7}
.tab .n{margin-left:auto;font-size:11px;background:#30363d;border-radius:8px;padding:0 5px}
.tab.sel .n{background:#a371f7;color:#0d1117}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.badge{position:absolute;right:52px;top:5px;background:#f0883e;color:#0d1117;font-weight:700;font-size:12px;border-radius:9px;padding:1px 7px}
.clock{position:absolute;right:6px;top:5px;font-size:13px;font-weight:600;color:#c9d1d9}
.lead{position:absolute;left:6px;top:32px;width:160px;height:214px;background:#1c2430;border-radius:6px;padding:8px}
.row{position:absolute;left:172px;width:302px;border-radius:6px;display:flex;align-items:center;gap:7px;padding-right:6px;background:#161b22;overflow:hidden}
.row .bar{width:4px;align-self:stretch;background:var(--s)}
.nm{font-weight:700;font-size:12px;white-space:nowrap}
.act{font-size:11px;color:#8b949e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spr{width:22px;height:26px;border-radius:11px 11px 4px 4px;background:var(--rc);flex:none;position:relative}
.spr::after{content:"";position:absolute;left:5px;top:7px;width:12px;height:4px;border-left:3px solid #111;border-right:3px solid #111}
.spr.sm{width:16px;height:18px;border-radius:8px 8px 3px 3px}.spr.sm::after{left:3px;top:5px;width:10px;height:3px;border-width:0 2px}
.spr.big{width:44px;height:52px;border-radius:22px 22px 8px 8px}
.spr.big::after{left:11px;top:15px;width:22px;height:7px;border-width:0 5px}
.work{animation:bob 1.2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-2px)}}
.blink{animation:bl 1s steps(2) infinite}@keyframes bl{50%{background:#f0883e}}
.segs{display:flex;gap:2px}.segs i{flex:1;height:7px;border-radius:2px;background:#30363d}.segs i.d{background:#3fb950}.segs i.c{background:#a371f7}
.usage{white-space:nowrap;position:absolute;left:0;right:0;bottom:0;height:22px;background:#161b22;display:flex;align-items:center;gap:16px;padding:0 8px;font-size:12px;color:#8b949e}
.q{display:flex;align-items:center;gap:5px}
.g{width:60px;height:6px;border-radius:3px;background:#30363d;overflow:hidden;flex:none}.g i{display:block;height:100%}
.q b{color:#e6edf3}
.lbl{font-size:10px;letter-spacing:1px;color:#a371f7;font-weight:700}
.note{font-size:13px;color:#8b949e;margin:4px 0 0;max-width:480px}
</style>

<h2>Maquette complète : disposition B, style sombre net</h2>
<p class="subtitle">Taille réelle 480x272. Quatre états de l'écran.</p>
<div class="grid" id="g"></div>

<script>
const tabs=(sel=0)=>`<div class="tabs">${[["artillery-x3","#3fb950",6],["conforama-rdv","#f0883e",2],["dotfiles","#6e7681",1]].map((t,i)=>`<div class="tab ${i==sel?"sel":""}"><span class="dot" style="background:${t[1]}"></span>${t[0]}<span class="n">${t[2]}</span></div>`).join("")}</div><div class="badge">1 !</div><div class="clock">14:32</div>`;
const usage=`<div class="usage"><span class="q">Session 5h <span class="g"><i style="width:48%;background:#3fb950"></i></span><b>48%</b> reset 1h20</span><span class="q">Week <span class="g"><i style="width:61%;background:#d29922"></i></span><b>61%</b> reset 2d03h</span></div>`;
const leadPanel=`<div class="lead"><div style="display:flex;gap:8px;align-items:center"><span class="spr big work" style="--rc:#c8a028"></span><div><div style="font-weight:700;font-size:14px">artillery-x3</div><div style="font-size:11px;color:#3fb950">working, 12m</div><div style="font-size:11px;color:#8b949e">ctx 34%</div></div></div>
<div class="act" style="margin-top:8px;font-size:12px">Waiting on 4 sub-agents</div>
<div class="lbl" style="margin-top:12px">PLAN 3/8</div>
<div class="segs" style="margin:4px 0"><i class="d"></i><i class="d"></i><i class="c"></i><i></i><i></i><i></i><i></i><i></i></div>
<div style="font-size:13px;line-height:16px">Write the failing tests</div>
<div style="font-size:11px;color:#8b949e;margin-top:6px">next: Implement roles.cpp</div></div>`;
const subs=[["Explore","#1eaaa0","Grep \"picq\" in agent-gadget/","#3fb950",1],["Plan","#966ed2","Read docs/superpowers/specs/...","#3fb950",1],["code-reviewer","#dc64aa","Needs you: allow Bash(pio run)?","#f0883e",0],["test-runner","#aa6e3c","python -m unittest discover","#3fb950",1],["general-purpose","#8c8c96","Done","#6e7681",0]];
const more=[["Explore","#1eaaa0","Read layout.cpp","#3fb950",1],["junior-dev","#5ac8eb","Edit display_hmi.cpp","#3fb950",1],["senior-dev","#3c8ce6","Bash: pio run -e esp32dev","#3fb950",1]];
const row2=(a,i,sel)=>`<div class="row" style="top:${32+i*36}px;height:32px;--s:${a[3]};${a[3]=="#6e7681"?"opacity:.5;":""}${sel?"outline:2px solid #a371f7;":""}"><span class="bar"></span><span class="spr ${a[4]?"work":""} ${a[3]=="#f0883e"?"blink":""}" style="--rc:${a[1]}"></span><div style="flex:1;overflow:hidden"><div class="nm">${a[0]}</div><div class="act" ${a[3]=="#f0883e"?'style="color:#f0883e"':""}>${a[2]}</div></div></div>`;
const row1=(a,i)=>`<div class="row" style="top:${32+i*27}px;height:24px;--s:${a[3]};${a[3]=="#6e7681"?"opacity:.5":""}"><span class="bar"></span><span class="spr sm ${a[4]?"work":""}" style="--rc:${a[1]}"></span><span class="nm" style="width:92px;overflow:hidden;text-overflow:ellipsis">${a[0]}</span><span class="act" style="flex:1;${a[3]=="#f0883e"?"color:#f0883e":""}">${a[2]}</span></div>`;
const detail=`<div class="lead" style="outline:2px solid #a371f7"><div style="display:flex;gap:8px;align-items:center"><span class="spr big" style="--rc:#dc64aa"></span><div><div style="font-weight:700;font-size:14px">code-reviewer</div><div style="font-size:11px;color:#f0883e">needs you, 2m</div><div style="font-size:11px;color:#8b949e">41.2k tokens</div></div></div>
<div class="lbl" style="margin-top:12px">COMMAND</div>
<div style="font-size:12px;line-height:15px;margin-top:3px;word-break:break-all">Bash: pio run -e esp32dev_test -t upload --upload-port COM3</div>
<div class="lbl" style="margin-top:10px">BEFORE</div>
<div style="font-size:11px;color:#8b949e;margin-top:2px">Read display_hmi.cpp (40s ago)</div>
<div style="font-size:10px;color:#6e7681;position:absolute;bottom:6px">tap to go back</div></div>`;
const standby=`<div class="scr" style="background:#05070a"><div style="position:absolute;top:44px;width:100%;text-align:center;font-size:112px;font-weight:300;letter-spacing:2px;color:#e6edf3;line-height:1">14:32</div>
<div style="position:absolute;top:166px;width:100%;text-align:center;font-size:18px;color:#8b949e">Wednesday 11 November</div>
<div style="position:absolute;top:196px;width:100%;text-align:center;font-size:12px;color:#6e7681">3 sessions idle, last activity 7m ago</div>${usage.replace('background:#161b22','background:transparent')}</div>`;
const screens=[
 ["1. Normal : 5 sous-agents ou moins",`<div class="scr">${tabs()}${leadPanel}${subs.map((a,i)=>row2(a,i)).join("")}${usage}</div>`,"Heure en haut à droite. Contexte de la session dans le panneau du lead. Le sprite du code-reviewer clignote en orange."],
 ["2. Normal : 6 à 8 sous-agents",`<div class="scr">${tabs()}${leadPanel}${[...subs.slice(0,4),...more,subs[4]].map((a,i)=>row1(a,i)).join("")}${usage}</div>`,"Lignes compactes : nom + action sur une ligne, 8 tiennent. Au-delà, « +N » et les agents terminés sortent en premier."],
 ["3. Tap sur un sous-agent",`<div class="scr">${tabs()}${detail}${subs.map((a,i)=>row2(a,i,i==2)).join("")}${usage}</div>`,"Le panneau gauche montre le détail de l'agent touché. Retour au lead après 10 s ou par un tap."],
 ["4. Veille : 5 min sans activité",standby,"Grands chiffres, date, résumé, quotas. Le premier événement d'agent ou un tap fait revenir l'écran normal."]];
document.getElementById("g").innerHTML=screens.map(s=>`<div><h3>${s[0]}</h3><div class="wrap">${s[1]}</div><p class="note">${s[2]}</p></div>`).join("");
</script>
