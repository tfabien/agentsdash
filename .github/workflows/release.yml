name: release

# A tag vX.Y.Z packs the core (the hub folder without test/ and tools/) into agentsdash-core-X.Y.Z-p<protocol>.tar.gz with its sha256 file.
# Adapters download the tarball at first run and check the hash before unpacking.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run tests
        run: node --test hub/test/*.test.mjs
      - name: Pack the core
        run: |
          V="${GITHUB_REF_NAME#v}"
          CORE="$(node -p "require('./hub/package.json').version")"
          if [ "$V" != "$CORE" ]; then echo "tag $V does not match hub/package.json $CORE"; exit 1; fi
          P="$(node -p "require('./hub/package.json').protocol")"
          FILE="agentsdash-core-$V-p$P.tar.gz"
          git archive --format=tar.gz --prefix="agentsdash-core-$V/" -o "$FILE" "HEAD:hub" ':(exclude)test' ':(exclude)tools'
          sha256sum "$FILE" > "$FILE.sha256"
          echo "FILE=$FILE" >> "$GITHUB_ENV"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$FILE" "$FILE.sha256" --generate-notes

  # The native widget host, compiled per OS and attached to the same release. A hub without a local build downloads it on the first
  # click of the widget button (hub/widget/fetch.mjs), so the asset name and the tar layout (the files of bin/ at the root) are a contract.
  widget:
    needs: release
    strategy:
      matrix:
        include:
          - { os: windows-latest, dir: windows, tag: win }
          - { os: macos-latest, dir: macos, tag: mac }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build the host
        run: node hub/widget/build.mjs
      - name: Pack and upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          FILE="agentsdash-widget-${{ matrix.tag }}-$V.tar.gz"
          tar -czf "$FILE" -C hub/widget/${{ matrix.dir }}/bin .
          sha256sum "$FILE" > "$FILE.sha256"
          gh release upload "$GITHUB_REF_NAME" "$FILE" "$FILE.sha256"
